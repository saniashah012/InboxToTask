# Offline checks only: no secrets, Supabase stack, Gmail, or model calls.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    name: Offline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Checkpoint 3/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Checkpoint 3/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:calendar
      - run: npm run supabase:prepare
      - run: npx --yes --package deno deno check supabase/functions/*/index.ts

  web:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Checkpoint 3/app/web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec tsc --noEmit
      - run: corepack pnpm build
